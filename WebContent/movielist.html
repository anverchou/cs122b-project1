
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fabflix - Movie List</title>

    <style>
        :root{
            --bg:#ffffff;
            --panel:#ffffff;
            --subtle:#f7f7f7;
            --text:#222222;
            --muted:#717171;
            --border:#dddddd;
            --accent: #5f64ef;
            --accentHover: #1351dc;
            --shadow:0 6px 18px rgba(0,0,0,.12);
            --shadowSoft:0 1px 2px rgba(0,0,0,.08);
            --radius:18px;
        }

        *{ box-sizing:border-box; }

        body{
            margin:0;
            font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
            background:var(--bg);
            color:var(--text);
        }

        .container{
            max-width:1100px;
            margin:32px auto;
            padding:0 16px;
        }

        a{
            color:var(--accent);
            text-decoration:none;
        }
        a:hover{
            color:var(--accentHover);
            text-decoration:underline;
        }

        .card{
            background:var(--panel);
            border:1px solid var(--border);
            border-radius:var(--radius);
            overflow:hidden;
            box-shadow:var(--shadowSoft);
        }

        .status{
            color:var(--muted);
            padding:12px 16px;
            border-bottom:1px solid var(--border);
            background:var(--panel);
        }

        .header{
            display:flex;
            align-items:flex-end;
            justify-content:space-between;
            gap:12px;
            margin-bottom:14px;
        }

        .header-left{
            display:flex;
            flex-direction:column;
            gap:10px;
            min-width:0;
        }

        h1{
            margin:0;
            font-size:28px;
            font-weight:700;
            letter-spacing:-0.02em;
        }

        .toolbar{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            align-items:center;
        }

        .tool{
            display:flex;
            align-items:center;
            gap:8px;
            flex-wrap:wrap;
        }

        .tool-label{
            font-size:12px;
            font-weight:800;
            color:var(--muted);
            text-transform:uppercase;
            letter-spacing:.08em;
        }

        .select{
            padding:10px 14px;
            border:1px solid var(--border);
            border-radius:999px;
            background:var(--panel);
            color:var(--text);
            font-weight:700;
            cursor:pointer;
            outline:none;
            appearance:none;
            -webkit-appearance:none;
            -moz-appearance:none;
        }

        .select:focus{
            border-color:var(--accent);
            box-shadow:0 0 0 3px rgba(95,100,239,.15);
        }

        .page-label{
            padding:10px 14px;
            border:1px solid var(--border);
            border-radius:999px;
            background:var(--panel);
            font-weight:700;
            color:var(--text);
            white-space:nowrap;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th, td{
            padding:14px 16px;
            border-bottom:1px solid var(--border);
            vertical-align:top;
        }

        th{
            text-align:left;
            font-size:12px;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:.08em;
            color:var(--muted);
            background:var(--panel);
        }

        tr:hover td{
            background:var(--subtle);
        }

        .nowrap{ white-space:nowrap; }

        .btn{
            padding:10px 14px;
            border:1px solid var(--border);
            border-radius:999px;
            background:var(--panel);
            cursor:pointer;
            font-weight:700;
            display:inline-flex;
            align-items:center;
            gap:8px;
            white-space:nowrap;
        }

        .btn:disabled{
            opacity:.55;
            cursor:not-allowed;
        }

        a.btn{
            color:var(--text);
            text-decoration:none;
        }

        a.btn:hover{
            background:var(--subtle);
            border-color:var(--accent);
            color:var(--accentHover);
            text-decoration:none;
        }

        button.btn:hover{
            background:var(--subtle);
            border-color:var(--accent);
            color:var(--accentHover);
        }

        @media (max-width: 780px){
            .header{
                align-items:flex-start;
                flex-direction:column;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <div class="header">
        <div class="header-left">
            <h1>Top 20 Movies</h1>

            <div class="toolbar">
                <div class="tool">
                    <span class="tool-label">Sort</span>
                    <select id="sort_select" class="select">
                        <option value="rating_title">Rating, then Title</option>
                        <option value="title_rating">Title, then Rating</option>
                    </select>
                </div>

                <div class="tool">
                    <span class="tool-label">Direction</span>
                    <select id="dir_select" class="select">
                        <option value="desc">Descending</option>
                        <option value="asc">Ascending</option>
                    </select>
                </div>

                <div class="tool">
                    <span class="tool-label">Per page</span>
                    <select id="page_size_select" class="select">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>

                <div class="tool">
                    <button class="btn" id="prev_btn" type="button">Prev</button>
                    <span class="page-label" id="page_label">Page 1</span>
                    <button class="btn" id="next_btn" type="button">Next</button>
                </div>
            </div>
        </div>

        <a class="btn" href="main.html?reset=1">← Back to Search</a>
    </div>

    <div class="card">
        <div id="status" class="status">Loading…</div>

        <table>
            <thead>
            <tr>
                <th style="width:22%">Title</th>
                <th class="nowrap" style="width:8%">Year</th>
                <th style="width:18%">Director</th>
                <th style="width:24%">Genres</th>
                <th style="width:20%">Stars</th>
                <th class="nowrap" style="width:8%">Rating</th>
            </tr>
            </thead>
            <tbody id="movie_table_body"></tbody>
        </table>
    </div>
</div>

<script src="movielist.js?v=3"></script>
</body>
</html>
