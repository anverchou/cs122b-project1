<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fabflix - Single Movie</title>

    <style>
        :root{
            --bg:#ffffff;
            --panel:#ffffff;
            --subtle:#f7f7f7;
            --text:#222222;
            --muted:#717171;
            --border:#dddddd;
            --accent:#5f64ef;
            --accentHover:#1351dc;
            --shadow:0 6px 18px rgba(0,0,0,.12);
            --shadowSoft:0 1px 2px rgba(0,0,0,.08);
            --radius:18px;
        }

        *{ box-sizing:border-box; }

        body{
            margin:0;
            font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
            background:var(--bg);
            color:var(--text);
        }

        .container{
            max-width:900px;
            margin:32px auto;
            padding:0 16px;
        }

        a{
            color:var(--accent);
            text-decoration:none;
        }
        a:hover{
            color:var(--accentHover);
            text-decoration:underline;
        }

        .card{
            background:var(--panel);
            border:1px solid var(--border);
            border-radius:var(--radius);
            overflow:hidden;
            box-shadow:var(--shadowSoft);
        }

        .status{
            color:var(--muted);
            padding:12px 16px;
            border-bottom:1px solid var(--border);
            background:var(--panel);
        }

        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:12px;
            margin-bottom:14px;
        }

        .back a{
            color:var(--text);
            text-decoration:none;
            font-weight:600;
        }
        .back a:hover{
            color:var(--text);
            text-decoration:underline;
        }

        .content{ padding:16px; }

        h1{
            margin:0;
            font-size:28px;
            font-weight:700;
            letter-spacing:-0.02em;
        }

        .meta{
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap:10px 16px;
            margin-top:10px;
        }

        .meta div{
            padding:12px 14px;
            border:1px solid var(--border);
            border-radius:14px;
            background:var(--panel);
        }

        .label{
            color:var(--muted);
            font-size:12px;
            text-transform:uppercase;
            letter-spacing:.08em;
            margin-bottom:4px;
            font-weight:700;
        }

        .value{
            font-size:15px;
            color:var(--text);
        }

        .section{ margin-top:16px; }

        .section h2{
            margin:0 0 10px;
            font-size:14px;
            color:var(--muted);
            text-transform:uppercase;
            letter-spacing:.08em;
            font-weight:800;
        }

        .chips{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
        }

        .chip{
            display:inline-flex;
            align-items:center;
            padding:8px 12px;
            border:1px solid var(--border);
            border-radius:999px;
            background:var(--panel);
            font-size:14px;
            color:var(--text);
        }

        a.chip{
            color:var(--text);
            text-decoration:none;
        }
        a.chip:hover{
            background:var(--subtle);
            border-color:var(--accent);
            color:var(--accentHover);
            text-decoration:none;
        }

        .pills-row{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            margin-top:12px;
        }

        .info-pill{
            display:inline-flex;
            align-items:center;
            padding:10px 14px;
            border:1px solid var(--border);
            border-radius:999px;
            background:var(--panel);
            color:var(--text);
            font-size:14px;
            white-space:nowrap;
        }

        .footer-links{ margin-top:18px; }
    </style>
</head>

<body>
<div class="container">
    <div class="topbar">
        <div class="back"><a href="movielist.html">← Back to Movie List</a></div>
    </div>

    <div class="card">
        <div id="status" class="status">Loading…</div>

        <div class="content">
            <h1 id="movie_title">Movie</h1>

            <div class="pills-row">
                <div class="info-pill" id="movie_year_pill">Year: —</div>
                <div class="info-pill" id="movie_rating_pill">Rating: —</div>
                <div class="info-pill" id="movie_director_pill">Director: —</div>
            </div>

            <div class="section">
                <h2>Genres</h2>
                <div class="chips" id="genre_chips"></div>
            </div>

            <div class="section">
                <h2>Stars</h2>
                <div class="chips" id="star_chips"></div>
            </div>

            <div class="footer-links">
                <a href="movielist.html">Back to Movie List</a>
            </div>
        </div>
    </div>
</div>

<script src="singlemovie.js?v=3"></script>
</body>
</html>
