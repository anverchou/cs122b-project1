<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fabflix - Main</title>

    <style>
        :root{
            --bg:#ffffff;
            --panel:#ffffff;
            --subtle:#f7f7f7;
            --text:#222222;
            --muted:#717171;
            --border:#dddddd;
            --accent:#5f64ef;
            --accentHover:#1351dc;
            --shadowSoft:0 1px 2px rgba(0,0,0,.08);
            --radius:18px;
        }

        *{ box-sizing:border-box; }

        body{
            margin:0;
            font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
            background:var(--bg);
            color:var(--text);
        }

        .container{
            max-width:980px;
            margin:32px auto;
            padding:0 16px;
        }

        a{
            color:var(--accent);
            text-decoration:none;
        }
        a:hover{
            color:var(--accentHover);
            text-decoration:underline;
        }

        h1{
            margin:0 0 10px;
            font-size:28px;
            letter-spacing:-.02em;
        }

        .topbar{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            flex-wrap:wrap;
            margin-bottom:10px;
        }

        .card{
            background:var(--panel);
            border:1px solid var(--border);
            border-radius:var(--radius);
            box-shadow:var(--shadowSoft);
            padding:16px;
        }

        .section{ margin-top:18px; }

        .section h2{
            margin:0 0 10px;
            font-size:14px;
            color:var(--muted);
            text-transform:uppercase;
            letter-spacing:.08em;
            font-weight:800;
        }

        .grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;
        }

        .field label{
            display:block;
            font-weight:700;
            font-size:12px;
            color:var(--muted);
            text-transform:uppercase;
            letter-spacing:.08em;
            margin-bottom:6px;
        }

        .field input{
            width:100%;
            padding:10px 12px;
            border:1px solid var(--border);
            border-radius:12px;
            font-size:14px;
            background:var(--panel);
            outline:none;
        }

        .field input:focus{
            border-color:var(--accent);
            box-shadow:0 0 0 3px rgba(95,100,239,.15);
        }

        .actions{
            margin-top:12px;
            display:flex;
            gap:10px;
            align-items:center;
            flex-wrap:wrap;
        }

        .btn{
            padding:10px 14px;
            border:1px solid var(--border);
            border-radius:999px;
            background:var(--panel);
            cursor:pointer;
            font-weight:700;
            display:inline-flex;
            align-items:center;
            color:var(--text);
            text-decoration:none;
            white-space:nowrap;
        }

        .btn:hover{
            background:var(--subtle);
            border-color:var(--accent);
            color:var(--accentHover);
            text-decoration:none;
        }

        .btn.primary{
            background:var(--accent);
            border-color:var(--accent);
            color:#fff;
        }
        .btn.primary:hover{
            background:var(--accentHover);
            border-color:var(--accentHover);
            color:#fff;
        }

        .chips{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
        }

        .chip{
            display:inline-flex;
            align-items:center;
            padding:8px 12px;
            border:1px solid var(--border);
            border-radius:999px;
            background:var(--panel);
            color:var(--text);
            font-size:14px;
            text-decoration:none;
        }

        a.chip{
            color:var(--text);
            text-decoration:none;
        }
        a.chip:hover{
            background:var(--subtle);
            border-color:var(--accent);
            color:var(--accentHover);
            text-decoration:none;
        }

        @media (max-width: 720px){
            .grid{ grid-template-columns:1fr; }
        }
    </style>
</head>

<body>
<div class="container">
    <div class="topbar">
        <h1>Fabflix</h1>
        <button class="btn" id="logout_btn" type="button">Sign out</button>
    </div>

    <div class="card">
        <div class="section" style="margin-top:0;">
            <h2>Search</h2>

            <form id="search_form" action="movielist.html" method="get">
                <div class="grid">
                    <div class="field">
                        <label>Title</label>
                        <input name="title"/>
                    </div>
                    <div class="field">
                        <label>Year (exact)</label>
                        <input name="year" inputmode="numeric">
                    </div>
                    <div class="field">
                        <label>Director</label>
                        <input name="director">
                    </div>
                    <div class="field">
                        <label>Star Name</label>
                        <input name="star">
                    </div>
                </div>

                <div class="actions">
                    <button class="btn primary" type="submit">Search</button>
                    <a class="btn" href="movielist.html">Top 20 Rated</a>
                    <a class="btn" href="cart.html">Checkout</a>
                </div>
            </form>
        </div>

        <div class="section">
            <h2>Browse by Genre</h2>
            <div id="genres" class="chips"></div>
        </div>

        <div class="section">
            <h2>Browse by Title</h2>
            <div id="title_browse" class="chips"></div>
        </div>
    </div>
</div>

<script src="main.js?v=4"></script>
</body>
</html>
