<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fabflix - Employee Dashboard Login</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <style>
        :root{
            --bg:#ffffff;
            --text:#222;
            --muted:#666;
            --border:#dddddd;
            --accent:#5f64ef;
            --shadow:0 1px 2px rgba(0,0,0,.08);
            --radius:18px;
        }

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
            background:var(--bg);
            color:var(--text);
        }

        h1{
            margin:0 0 8px 0;
            font-size:22px;
        }

        p{
            margin:0 0 18px 0;
            color:var(--muted);
            line-height:1.45;
        }

        label{
            display:block;
            margin:12px 0 6px 0;
            font-size:14px;
            color:#333;
        }

        input{
            width:100%;
            padding:12px 12px;
            border:1px solid var(--border);
            border-radius:12px;
            font-size:15px;
        }

        button{
            margin-top:14px;
            width:100%;
            padding:12px 14px;
            border:none;
            border-radius:12px;
            background:var(--accent);
            color:#fff;
            font-size:15px;
            cursor:pointer;
        }

        button:hover{
            filter:brightness(.95);
        }

        .container{
            max-width:520px;
            margin:56px auto;
            padding:0 16px;
        }

        .card{
            border:1px solid var(--border);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            padding:22px;
        }

        .err{
            margin-top:12px;
            color:#b00020;
            min-height:20px;
        }

        .small{
            margin-top:14px;
            font-size:13px;
            color:var(--muted);
        }

        .small a{
            color:var(--accent);
            text-decoration:none;
        }

        .small a:hover{
            text-decoration:underline;
        }

    </style>
</head>

<body>
<div class="container">
    <div class="card">
        <h1>Employee Dashboard</h1>
        <p>Log in with an employee account to manage Fabflix.</p>

        <form id="employee_login_form">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required />

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <div class="g-recaptcha" data-sitekey="6LeRhWcsAAAAAIf67JQ5VEtTGML-fh-WQ-jSBIgG"></div>

            <button type="submit">Sign in</button>
            <div id="employee_login_error" class="err"></div>
        </form>

        <div class="small">
            Back to customer site: <a href="main.html">Main Page</a>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="dashboard-login.js"></script>
</body>
</html>
