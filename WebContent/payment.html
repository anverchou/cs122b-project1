
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fabflix - Payment</title>

  <style>
    :root{
      --bg:#ffffff;
      --panel:#ffffff;
      --subtle:#f7f7f7;
      --text:#222222;
      --muted:#717171;
      --border:#dddddd;
      --accent:#5f64ef;
      --accentHover:#1351dc;
      --shadowSoft:0 1px 2px rgba(0,0,0,.08);
      --radius:18px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .container{
      max-width:900px;
      margin:32px auto;
      padding:0 16px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
    }

    h1{
      margin:0;
      font-size:28px;
      font-weight:700;
      letter-spacing:-0.02em;
    }

    .btn{
      padding:10px 14px;
      border:1px solid var(--border);
      border-radius:999px;
      background:var(--panel);
      cursor:pointer;
      font-weight:700;
      display:inline-flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
      color:var(--text);
      text-decoration:none;
    }

    .btn:hover{
      background:var(--subtle);
      border-color:var(--accent);
      color:var(--accentHover);
      text-decoration:none;
    }

    .btn.primary{
      background:var(--accent);
      border-color:var(--accent);
      color:#fff;
    }

    .btn.primary:hover{
      background:var(--accentHover);
      border-color:var(--accentHover);
      color:#fff;
    }

    .card{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadowSoft);
    }

    .status{
      color:var(--muted);
      padding:12px 16px;
      border-bottom:1px solid var(--border);
      background:var(--panel);
    }

    .content{
      padding:16px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      padding:10px 14px;
      border:1px solid var(--border);
      border-radius:999px;
      background:var(--panel);
      font-weight:800;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:14px;
    }

    .field label{
      display:block;
      font-weight:800;
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.08em;
      margin-bottom:6px;
    }

    .field input{
      width:100%;
      padding:10px 12px;
      border:1px solid var(--border);
      border-radius:12px;
      font-size:14px;
      background:var(--panel);
      outline:none;
    }

    .field input:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(95,100,239,.15);
    }

    .actions{
      margin-top:12px;
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .err{
      margin-top:10px;
      color:#b42318;
      font-weight:700;
    }

    @media (max-width: 720px){
      .grid{ grid-template-columns:1fr; }
    }
  </style>
</head>

<body>
<div class="container">
  <div class="topbar">
    <a class="btn" href="cart.html">← Back to Cart</a>
  </div>

  <div class="card">
    <div id="status" class="status">Loading…</div>
    <div class="content">
      <h1>Payment</h1>

      <div style="margin-top:10px;">
        <span class="pill">Total: $<span id="total_price">0.00</span></span>
      </div>

      <form id="payment_form" style="margin-top:14px;">
        <div class="grid">
          <div class="field">
            <label>First name</label>
            <input name="firstName" autocomplete="cc-given-name" required />
          </div>
          <div class="field">
            <label>Last name</label>
            <input name="lastName" autocomplete="cc-family-name" required />
          </div>
          <div class="field">
            <label>Credit card number</label>
            <input name="cardNumber" inputmode="numeric" autocomplete="cc-number" required />
          </div>
          <div class="field">
            <label>Expiration date</label>
            <input type="date" name="expiration" autocomplete="cc-exp" required />
          </div>
        </div>

        <div class="actions">
          <button class="btn primary" type="submit">Place Order</button>
        </div>

        <div id="error" class="err" style="display:none;"></div>
      </form>
    </div>
  </div>
</div>

<script src="payment.js?v=1"></script>
</body>
</html>
