<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fabflix - Movie List</title>

    <link rel="stylesheet" href="movielist.css" />
</head>

<body>
<div class="container">
    <div class="header">
        <div>
            <h1>Top 20 Movies List</h1>
        </div>
    </div>

    <div class="card">
        <div id="status" class="status">Loading…</div>

        <table>
            <thead>
            <tr>
                <th style="width:22%">Title</th>
                <th class="nowrap" style="width:8%">Year</th>
                <th style="width:18%">Director</th>
                <th style="width:24%">Genres</th>
                <th style="width:20%">Stars</th>
                <th class="nowrap" style="width:8%">Rating</th>
            </tr>
            </thead>
            <tbody id="movie_table_body"></tbody>
        </table>
    </div>
</div>

<script src="movielist.js"></script>
</body>
</html>
