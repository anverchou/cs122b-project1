
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login to Fabflix</title>

    <style>
        :root{
            --bg:#ffffff;
            --panel:#ffffff;
            --subtle:#f7f7f7;
            --text:#222222;
            --muted:#717171;
            --border:#dddddd;
            --accent:#5f64ef;
            --accentHover:#1351dc;
            --shadow:0 6px 18px rgba(0,0,0,.12);
            --shadowSoft:0 1px 2px rgba(0,0,0,.08);
            --radius:18px;
        }

        *{ box-sizing:border-box; }

        body{
            margin:0;
            font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
            background:var(--bg);
            color:var(--text);
        }

        .wrap{
            max-width:520px;
            margin:60px auto;
            padding:0 16px;
        }

        a{
            color:var(--accent);
            text-decoration:none;
        }
        a:hover{
            color:var(--accentHover);
            text-decoration:underline;
        }

        .card{
            background:var(--panel);
            border:1px solid var(--border);
            border-radius:var(--radius);
            overflow:hidden;
            box-shadow:var(--shadowSoft);
        }

        .content{ padding:16px; }

        h2{
            margin:0 0 14px;
            font-size:22px;
            font-weight:800;
            letter-spacing:-0.01em;
        }

        label{
            display:block;
            color:var(--muted);
            font-size:12px;
            text-transform:uppercase;
            letter-spacing:.08em;
            margin:12px 0 6px;
            font-weight:700;
        }

        input{
            width:100%;
            padding:10px 12px;
            border:1px solid var(--border);
            border-radius:14px;
            background:var(--panel);
            font-size:14px;
            outline:none;
        }

        input:focus{
            border-color:var(--accent);
            box-shadow:0 0 0 3px rgba(95,100,239,.15);
        }

        button{
            margin-top:14px;
            width:100%;
            padding:10px 14px;
            border:1px solid var(--accent);
            border-radius:999px;
            background:var(--accent);
            color:#fff;
            font-weight:800;
            cursor:pointer;
        }

        button:hover{
            background:var(--accentHover);
            border-color:var(--accentHover);
        }

        #login_error_message{
            margin-top:12px;
            color:#b00020;
            font-weight:600;
        }

        .hint{
            margin-top:10px;
            color:var(--muted);
            font-size:13px;
        }
    </style>
</head>

<body>
<div class="wrap">
    <div class="card">
        <div class="content">
            <h2>Login to Fabflix</h2>

            <form id="login_form" method="post" action="#">
                <label>Email</label>
                <input name="email" type="text" placeholder="Enter email" required />

                <label>Password</label>
                <input name="password" type="password" placeholder="Enter password" required />

                <button type="submit">Login</button>
            </form>

            <div id="login_error_message"></div>
        </div>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="./login.js"></script>
</body>
</html>
